<svg viewBox="0 0 1152 1010" xmlns="http://www.w3.org/2000/svg" font-family="ABC Favorit Mono, ui-monospace, 'SF Mono', Menlo, monospace" font-variant-numeric="tabular-nums lining-nums"><!-- prime-intellect-data-viz: trusted --><rect x="0" y="0" width="1152" height="1010" fill="#111111"/><text x="64" y="58" font-size="12" fill="#7A7A7A" letter-spacing="0.12em">PRIME INTELLECT LAB · THE PIECES</text><text x="64" y="104" font-size="26" fill="#FFFFFF" letter-spacing="0.01em">Everything is an environment.</text><rect x="64" y="150" width="1024" height="92" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="86" y="178" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE FRONT DOOR</text><text x="86" y="212" font-size="22" fill="#FFFFFF" letter-spacing="0.02em">PRIME CLI</text><text x="1066" y="212" font-size="14" fill="#BCBCBC" letter-spacing="0.04em" text-anchor="end">eval run · rl run · gepa run · env init · env push</text><rect x="64" y="262" width="502" height="148" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="86" y="290" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE FRAMEWORK</text><text x="86" y="322" font-size="22" fill="#FFFFFF" letter-spacing="0.02em">VERIFIERS</text><text x="86" y="352" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">The open-source Python framework —</text><text x="86" y="374" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">tasksets, harnesses, traces, rollouts.</text><text x="86" y="398" font-size="12" fill="#7A7A7A" letter-spacing="0.04em">You write environments in it (later tutorials).</text><rect x="586" y="262" width="502" height="148" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="608" y="290" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE CATALOG</text><text x="608" y="322" font-size="22" fill="#FFFFFF" letter-spacing="0.02em">ENVIRONMENT HUB</text><text x="608" y="352" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">Ready-made tasks from PI and the</text><text x="608" y="374" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">community — install and run any.</text><text x="608" y="398" font-size="12" fill="#7A7A7A" letter-spacing="0.04em">Publish yours: prime env push.</text><rect x="64" y="430" width="1024" height="118" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><rect x="64" y="430" width="4" height="118" fill="#B6FF3C"/><text x="86" y="458" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE UNIT OF WORK</text><text x="1066" y="458" font-size="11" fill="#7A7A7A" letter-spacing="0.06em" text-anchor="end">= TASKS + HOW TO RUN + HOW TO SCORE</text><text x="86" y="492" font-size="22" fill="#B6FF3C" letter-spacing="0.02em">ENVIRONMENT</text><text x="86" y="522" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">Package a task once — every use below runs the same definition and reads the same score.</text><path d="M 228 554 L 228 600 M 228 600 L 223.5 592.5 M 228 600 L 232.5 592.5" fill="none" stroke="#BCBCBC" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/><path d="M 576 554 L 576 600 M 576 600 L 571.5 592.5 M 576 600 L 580.5 592.5" fill="none" stroke="#BCBCBC" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/><path d="M 924 554 L 924 600 M 924 600 L 919.5 592.5 M 924 600 L 928.5 592.5" fill="none" stroke="#BCBCBC" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/><text x="592" y="580" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">ONE DEFINITION, THREE USES</text><rect x="64" y="606" width="328" height="168" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="86" y="634" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">TUTORIAL 2</text><text x="86" y="666" font-size="20" fill="#FFFFFF" letter-spacing="0.02em">EVALUATE</text><text x="86" y="696" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">How good is a model at</text><text x="86" y="718" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">this task? Local or hosted.</text><text x="86" y="750" font-size="13" fill="#7A7A7A" letter-spacing="0.04em">prime eval run</text><rect x="412" y="606" width="328" height="168" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="434" y="634" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">TUTORIAL 3</text><text x="434" y="666" font-size="20" fill="#FFFFFF" letter-spacing="0.02em">TRAIN WITH RL</text><text x="434" y="696" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">Make it better by updating</text><text x="434" y="718" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">the weights — via prime-rl.</text><text x="434" y="750" font-size="13" fill="#7A7A7A" letter-spacing="0.04em">prime rl run</text><rect x="760" y="606" width="328" height="168" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="782" y="634" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">TUTORIAL 4</text><text x="782" y="666" font-size="20" fill="#FFFFFF" letter-spacing="0.02em">OPTIMIZE PROMPTS</text><text x="782" y="696" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">Make it better by evolving</text><text x="782" y="718" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">the prompt — via GEPA.</text><text x="782" y="750" font-size="13" fill="#7A7A7A" letter-spacing="0.04em">prime gepa run</text><rect x="64" y="814" width="1024" height="112" fill="#1C1C1C" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="86" y="842" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">BEHIND THE SCENES</text><line x1="402" y1="856" x2="402" y2="926" stroke="rgba(255,255,255,.10)" stroke-width="1"/><line x1="750" y1="856" x2="750" y2="926" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="86" y="880" font-size="13" fill="#FFFFFF" letter-spacing="0.12em">PRIME INFERENCE</text><text x="86" y="904" font-size="13" fill="#BCBCBC" letter-spacing="0.04em">one key, models from every provider</text><text x="424" y="880" font-size="13" fill="#FFFFFF" letter-spacing="0.12em">SANDBOXES</text><text x="424" y="904" font-size="13" fill="#BCBCBC" letter-spacing="0.04em">isolated, disposable agent runtimes</text><text x="772" y="880" font-size="13" fill="#FFFFFF" letter-spacing="0.12em">HOSTED COMPUTE</text><text x="772" y="904" font-size="13" fill="#BCBCBC" letter-spacing="0.04em">GPUs, dashboards, streamed metrics</text><line x1="64" y1="954" x2="1088" y2="954" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="64" y="978" font-size="13" fill="#7A7A7A" letter-spacing="0.04em">Build with verifiers · share on the Hub · drive it all from the prime CLI — one score, same meaning everywhere.</text></svg>