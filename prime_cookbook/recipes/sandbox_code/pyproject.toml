[project]
name = "recipe-sandbox-code"
version = "0.1.0"
description = "Sandboxed code execution — PythonEnv with test-case rewards"
tags = ["code", "sandbox", "python-env", "execution"]
dependencies = ["verifiers>=0.1.10"]

[tool.hatch.build]
include = ["*.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 50
rollouts_per_example = 4
