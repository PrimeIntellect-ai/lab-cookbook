name: Publish Envs

on:
  push:
    branches:
      - main

concurrency:
  group: publish-envs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-envs:
    name: Detect all environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_envs: ${{ steps.set-matrix.outputs.has_envs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set matrix
        id: set-matrix
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          entries = []
          for pyproject in sorted(Path("environments").rglob("pyproject.toml")):
              if "tasks" in pyproject.parts:
                  continue

              data = tomllib.loads(pyproject.read_text())
              project = data.get("project", {})
              env_name = project.get("name")
              if not env_name:
                  continue

              entries.append(
                  {
                      "env_name": env_name,
                      "env_path": pyproject.parent.as_posix(),
                      "version": project.get("version", "unknown"),
                  }
              )

          if entries:
              print("Environments to publish:")
              for entry in entries:
                  print(f"- {entry['env_name']} {entry['version']} ({entry['env_path']})")
          else:
              print("No environments found under environments/")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"has_envs={'true' if entries else 'false'}\n")
              output.write(f"matrix={json.dumps({'include': entries}, separators=(',', ':'))}\n")
          PY

  publish-envs:
    name: Publish ${{ matrix.env_name }}
    needs: detect-envs
    if: needs.detect-envs.outputs.has_envs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-envs.outputs.matrix) }}
    env:
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install prime
        run: uv tool install prime

      - name: Push environment
        env:
          ENV_NAME: ${{ matrix.env_name }}
          ENV_PATH: ${{ matrix.env_path }}
          VERSION: ${{ matrix.version }}
        run: |
          echo "Publishing $ENV_NAME v$VERSION from $ENV_PATH"
          set +e
          output=$(prime env push -p "$ENV_PATH" --auto-bump 2>&1)
          exit_code=$?
          echo "$output"
          set -e

          # Check if this is just an unchanged content hash (not a real failure)
          if echo "$output" | grep -qi "content hash.*already exists\|already exists with the same content"; then
            echo "Environment $ENV_NAME v$VERSION unchanged - skipping (content hash already exists)"
            exit 0
          elif [ $exit_code -eq 0 ]; then
            echo "Successfully published $ENV_NAME v$VERSION"
            exit 0
          else
            echo "Failed to publish $ENV_NAME v$VERSION"
            exit 1
          fi
