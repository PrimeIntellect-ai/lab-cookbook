<svg viewBox="0 0 1152 720" xmlns="http://www.w3.org/2000/svg" font-family="ABC Favorit Mono, ui-monospace, 'SF Mono', Menlo, monospace" font-variant-numeric="tabular-nums lining-nums"><!-- prime-intellect-data-viz: trusted --><rect x="0" y="0" width="1152" height="720" fill="#111111" stroke="none" stroke-width="1"/><text x="64" y="58" font-size="12" fill="#7A7A7A" letter-spacing="0.12em">THE MENTAL MODEL · VERIFIERS V1</text><text x="64" y="104" font-size="26" fill="#FFFFFF" letter-spacing="0.01em">Four parts, one contract.</text><rect x="64" y="160" width="600" height="290" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="86" y="192" font-size="12" fill="#7A7A7A" letter-spacing="0.12em">ENVIRONMENT</text><text x="642" y="192" font-size="11" fill="#7A7A7A" letter-spacing="0.06em" text-anchor="end">= TASKSET + HARNESS</text><rect x="88" y="216" width="264" height="210" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="110" y="246" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE WHAT</text><text x="110" y="278" font-size="22" fill="#FFFFFF" letter-spacing="0.02em">TASKSET</text><text x="110" y="310" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">A typed collection of</text><text x="110" y="332" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">tasks — prompts, files,</text><text x="110" y="354" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">answers — plus the</text><text x="110" y="376" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">scoring: rewards &amp; metrics.</text><text x="110" y="404" font-size="12" fill="#7A7A7A" letter-spacing="0.04em">You usually write this.</text><rect x="376" y="216" width="264" height="210" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="398" y="246" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE HOW</text><text x="398" y="278" font-size="22" fill="#FFFFFF" letter-spacing="0.02em">HARNESS</text><text x="398" y="310" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">The rollout program</text><text x="398" y="332" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">that drives the model.</text><text x="398" y="354" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">default = a chat loop;</text><text x="398" y="376" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">bash, rlm, coding agents.</text><text x="398" y="404" font-size="12" fill="#7A7A7A" letter-spacing="0.04em">You rarely write one.</text><text x="364" y="329.0" font-size="26" fill="#7A7A7A" text-anchor="middle">+</text><rect x="824" y="160" width="264" height="290" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><rect x="824" y="160" width="4" height="290" fill="#B6FF3C"/><text x="846" y="190" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE RECORD</text><text x="846" y="222" font-size="22" fill="#B6FF3C" letter-spacing="0.02em">TRACE</text><text x="846" y="254" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">Every rollout emits one:</text><text x="846" y="276" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">the full message graph,</text><text x="846" y="298" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">tool calls, rewards,</text><text x="846" y="320" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">metrics, stop condition.</text><text x="846" y="390" font-size="14" fill="#FFFFFF" letter-spacing="0.04em">Scoring reads it;</text><text x="846" y="412" font-size="14" fill="#FFFFFF" letter-spacing="0.04em">eval saves it.</text><path d="M 670 305 L 818 305 M 818 305 L 810.5 300.5 M 818 305 L 810.5 309.5" fill="none" stroke="#BCBCBC" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/><text x="744.0" y="295" font-size="11" fill="#7A7A7A" letter-spacing="0.12em" text-anchor="middle">PRODUCES</text><rect x="376" y="508" width="264" height="150" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="398" y="538" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">THE WHERE</text><text x="398" y="570" font-size="22" fill="#FFFFFF" letter-spacing="0.02em">RUNTIME</text><text x="398" y="602" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">Local, Docker, or a remote</text><text x="398" y="624" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">sandbox — set via config,</text><text x="398" y="646" font-size="14" fill="#BCBCBC" letter-spacing="0.04em">not code.</text><path d="M 508.0 432 L 508.0 502 M 508.0 502 L 503.5 494.5 M 508.0 502 L 512.5 494.5" fill="none" stroke="#BCBCBC" stroke-width="1.5" stroke-linecap="butt"/><text x="524.0" y="471.0" font-size="11" fill="#7A7A7A" letter-spacing="0.12em">RUNS IN</text><line x1="64" y1="676" x2="1088" y2="676" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="64" y="700" font-size="13" fill="#7A7A7A" letter-spacing="0.04em">Taskset defines the problem &amp; the score   ·   Harness produces the behavior   ·   Trace is the contract between them.</text></svg>