rules:
  - id: no-future-annotations
    languages: [python]
    severity: ERROR
    message: Do not use `from __future__ import annotations`; quote only the specific forward references that need it.
    pattern: from __future__ import annotations

  - id: v1-config-param-one-type
    languages: [python]
    severity: ERROR
    message: Public v1 `config` parameters must be one concrete config type or `None`; keep raw mappings at explicit config-loader boundaries.
    paths:
      include:
        - /environments/**/*.py
    patterns:
      - pattern: |
          def $FUNC(..., config: $ANNOT = None, ...):
              ...
      - metavariable-regex:
          metavariable: $ANNOT
          regex: "(Any|ConfigMap|Mapping\\[str, object\\]|dict\\[str, object\\]|.*\\|.*\\|.*)"

  - id: no-raw-any-v1
    languages: [python]
    severity: ERROR
    message: Do not use raw `Any` in environment code; use a precise type or a named boundary alias in verifiers.v1.types.
    paths:
      include:
        - /environments/**/*.py
      exclude:
        - /environments/openenv_*/proj/**/*.py
    pattern-regex: "\\bAny\\b"

  - id: no-raw-object-containers-v1
    languages: [python]
    severity: ERROR
    message: Do not spell broad object containers in environment code; use the named boundary types ConfigMap, ConfigData, Handler, GroupHandler, Objects, TaskRow, ProgramMap, or a narrower type.
    paths:
      include:
        - /environments/**/*.py
      exclude:
        - /environments/openenv_*/proj/**/*.py
    pattern-regex: "(?x)(\\b(?:Mapping|MutableMapping|dict|list|Sequence|Iterable|Callable|Awaitable|tuple)\\[[^\\n\\]]*\\bobject\\b|\\bcast\\([^\\n)]*\\bobject\\b)"

  - id: no-raw-mapping-annotations-v1
    languages: [python]
    severity: ERROR
    message: Do not use raw Mapping annotations in environment code; prefer dict or a named v1 boundary type. Keep Mapping only for isinstance checks or explicit aliases.
    paths:
      include:
        - /environments/**/*.py
      exclude:
        - /environments/openenv_*/proj/**/*.py
    pattern-regex: "\\b(?:Mapping|MutableMapping)\\["
