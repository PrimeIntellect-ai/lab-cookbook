[project]
name = "recipe-tool-use"
version = "0.1.0"
description = "Stateless tool use — ToolEnv with 4 deterministic tools"
tags = ["tools", "function-calling", "single-turn"]
dependencies = ["verifiers>=0.1.10"]

[tool.hatch.build]
include = ["*.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 100
rollouts_per_example = 4
