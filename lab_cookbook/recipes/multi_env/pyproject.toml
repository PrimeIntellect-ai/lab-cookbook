[project]
name = "recipe-multi-env"
version = "0.1.0"
description = "Multi-environment training — EnvGroup combining math + tools + word game"
tags = ["multi-task", "env-group", "generalization", "curriculum"]
dependencies = ["verifiers>=0.1.10"]

[tool.hatch.build]
include = ["*.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 60
rollouts_per_example = 4
