[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prime-cookbook"
version = "0.1.0"
description = "Guides and recipes for Prime Intellect Lab"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.15.dev4",
    "datasets>=2.0",
    "openai>=1.0",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pre-commit",
    "ruff",
    "ty>=0.0.1a29,<0.0.22",
]
policy = [
    "semgrep>=1.150.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lab_cookbook"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".semgrep",
    "environments/*/tasks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ty.src]
include = ["environments"]
exclude = [
    "environments/*/tasks",
    "environments/openenv_*/proj",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
