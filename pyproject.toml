[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-cookbook"
version = "0.1.0"
description = "Guides and recipes for Prime Intellect Lab"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.1.15.dev404",
    "datasets>=2.0",
    "openai>=1.0",
    "scikit-learn>=1.3",
    "gsm8k",
    "wordle",
    "reverse-text",
    "wiki-search",
    "shape-detective",
    "math-python",
    "calendar-scheduling",
    "langchain-deep-agents",
    "langchain-deep-agents-wikispeedia",
    "ethics-debate",
    "swe-grep",
    "opencode-harbor",
    "basic-patent-q-and-a",
    "advanced-patent-q-and-a",
    "patent-technical-analysis",
    "simple-judge",
]

[tool.uv.workspace]
members = [
    "environments/gsm8k",
    "environments/wordle",
    "environments/reverse_text",
    "environments/wiki_search",
    "environments/shape_detective",
    "environments/math_python",
    "environments/calendar_scheduling",
    "environments/langchain_deep_agents",
    "environments/langchain_deep_agents_wikispeedia",
    "environments/ethics_debate",
    "environments/swe_grep",
    "environments/opencode_harbor",
    "environments/patent_search/basic_patent_q_and_a",
    "environments/patent_search/advanced_patent_q_and_a",
    "environments/patent_search/patent_technical_analysis",
    "environments/simple_judge",
]

[tool.uv.sources]
reverse-text = { workspace = true }
wordle = { workspace = true }
gsm8k = { workspace = true }
wiki-search = { workspace = true }
shape-detective = { workspace = true }
math-python = { workspace = true }
calendar-scheduling = { workspace = true }
langchain-deep-agents = { workspace = true }
langchain-deep-agents-wikispeedia = { workspace = true }
ethics-debate = { workspace = true }
swe-grep = { workspace = true }
opencode-harbor = { workspace = true }
basic-patent-q-and-a = { workspace = true }
advanced-patent-q-and-a = { workspace = true }
patent-technical-analysis = { workspace = true }
simple-judge = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pre-commit",
    "ruff",
    "ty>=0.0.1a29,<0.0.22",
]

[tool.uv]
default-groups = ["dev"]
prerelease = "allow"
upgrade-package = ["verifiers"]

[tool.hatch.build.targets.wheel]
packages = ["lab_cookbook"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".semgrep",
    "environments/*/tasks",
    "environments/*/.venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "chromadb",
    "chromadb.**",
    "nltk",
    "nltk.**",
    "PIL",
    "PIL.**",
    "textarena",
    "textarena.**",
]

[tool.ty.src]
include = ["environments"]
exclude = [
    "environments/*/tasks",
    "environments/openenv_*/proj",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
