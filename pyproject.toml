[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prime-cookbook"
version = "0.1.0"
description = "RL environment recipes for Prime Intellect Lab"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.10",
    "datasets>=2.0",
    "openai>=1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["lab_cookbook"]

[tool.verifiers.eval]
num_examples = 100
rollouts_per_example = 4

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
