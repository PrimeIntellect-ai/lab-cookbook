[project]
name = "recipe-math-rl"
version = "0.1.4"
description = "Math reasoning — SingleTurnEnv + MathRubric"
keywords = ["math", "reasoning", "single-turn"]
dependencies = ["verifiers>=0.1.10"]

[tool.hatch.build]
include = ["*.py", "pyproject.toml"]

[tool.setuptools]
py-modules = ["math_rl", "recipe_math_reasoning"]

[tool.verifiers.eval]
num_examples = 100
rollouts_per_example = 4

[tool.verifiers.environment]
entrypoint = "recipe_math_reasoning:load_environment"
