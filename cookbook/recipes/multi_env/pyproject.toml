[project]
name = "recipe-multi-env"
version = "0.1.2"
description = "Multi-environment training — EnvGroup combining math + tools + word game"
keywords = ["multi-task", "env-group", "generalization", "curriculum"]
dependencies = ["verifiers>=0.1.10"]

[tool.hatch.build]
include = ["*.py", "pyproject.toml"]

[tool.setuptools]
py-modules = ["multi_env", "recipe_multi_env"]

[tool.verifiers.eval]
num_examples = 60
rollouts_per_example = 4

[tool.verifiers.environment]
entrypoint = "recipe_multi_env:load_environment"
