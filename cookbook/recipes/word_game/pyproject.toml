[project]
name = "recipe-word-game"
version = "0.1.5"
description = "Wordle-style word game — MultiTurnEnv with partial rewards"
keywords = ["multi-turn", "game", "reasoning", "partial-reward"]
dependencies = ["verifiers>=0.1.10"]

[tool.hatch.build]
include = ["*.py", "pyproject.toml"]

[tool.setuptools]
py-modules = ["word_game", "recipe_word_game"]

[tool.verifiers.eval]
num_examples = 50
rollouts_per_example = 4

[tool.verifiers.environment]
entrypoint = "recipe_word_game:load_environment"
