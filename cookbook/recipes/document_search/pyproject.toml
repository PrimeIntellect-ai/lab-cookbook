[project]
name = "recipe-document-search"
version = "0.1.0"
description = "Document search — 3-level curriculum (metadata → reasoning → analysis)"
keywords = ["retrieval", "tool-use", "multi-step", "judge-rubric", "curriculum"]
dependencies = ["verifiers>=0.1.10"]

[tool.hatch.build]
include = ["*.py", "pyproject.toml"]

[tool.setuptools]
py-modules = ["document_search_l1", "document_search_l2", "document_search_l3", "recipe_document_search"]

[tool.verifiers.eval]
num_examples = 100
rollouts_per_example = 4

[tool.verifiers.environment]
entrypoint = "recipe_document_search:load_environment"
