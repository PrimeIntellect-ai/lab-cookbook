[project]
name = "swe-grep"
description = "Just another swe grep environment"
tags = ["train", "eval", "v1", "taskset", "harness"]
version = "0.3.3"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.15.dev11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["swe_grep.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
