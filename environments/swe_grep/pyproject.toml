[project]
name = "swe-grep"
description = "Just another swe grep environment"
tags = ["train", "eval", "v1", "taskset", "harness"]
version = "0.3.3"
requires-python = ">=3.10,<3.14"
dependencies = [
    "verifiers>=0.1.15.dev403",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["swe_grep.py", "pyproject.toml"]
