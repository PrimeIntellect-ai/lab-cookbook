[project]
name = "wordle"
description = "Wordle game environment (v1 taskset wrapping TextArena Wordle-v0)"
tags = ["textarena", "multi-turn", "reasoning", "game", "train", "eval", "v1", "taskset", "harness"]
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.15.dev4",
    "nltk>=3.9.2",
    "textarena==0.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["wordle.py", "textarena_taskset.py", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
