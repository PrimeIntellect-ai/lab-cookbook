[project]
name = "wordle"
description = "Wordle game environment (v1 taskset wrapping TextArena Wordle-v0)"
tags = ["textarena", "multi-turn", "reasoning", "game", "train", "eval", "v1", "taskset", "harness"]
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.15.dev12",
    "tasksets>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["wordle.py", "pyproject.toml", "README.md", "prompts/**"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
