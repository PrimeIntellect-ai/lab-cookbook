[project]
name = "langchain-deep-agents"
description = "Reusable v1 harness for running LangChain Deep Agents against taskset MCP tools"
tags = ["v1", "harness", "langchain", "deep-agents", "tool-use"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.1.15.dev403",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["langchain_deep_agents.py", "pyproject.toml", "README.md"]
