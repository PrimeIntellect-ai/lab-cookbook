[project]
name = "math-python"
description = "Solve math problems using Python in a sandbox environment"
tags = ["tool-use", "math", "sandbox", "train", "prime-sandboxes", "python", "coding"]
version = "0.1.11"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.1.15.dev403",
    "math-verify>=0.8.0",
    "prime-sandboxes>=0.2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["math_python.py", "pyproject.toml"]
