[project]
name = "simple-judge"
description = "Toy instruction-following taskset scored by an LLM judge."
tags = ["single-turn", "judge", "instruction-following", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers>=0.2.1.dev46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_judge"]
