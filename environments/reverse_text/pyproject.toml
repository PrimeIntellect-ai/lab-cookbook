[project]
name = "reverse-text"
version = "0.1.1"
description = "Reverse text character by character."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.15.dev4",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["reverse_text.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
