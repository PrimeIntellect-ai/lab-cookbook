[project]
name = "mini-loop"
description = "A from-scratch bash-loop CLI-agent harness — the worked example of the coding-agent-harness recipe."
tags = ["harness", "coding-agent", "v1"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers>=0.2.1.dev46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_loop"]
