[project]
name = "langchain-deep-agents-wikispeedia"
description = "V1 Wikispeedia taskset with native navigation tools"
tags = ["v1", "taskset", "multi-turn", "tool-use", "wikispeedia", "navigation", "train", "eval"]
version = "0.2.9"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.1.15.dev403",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["langchain_deep_agents_wikispeedia.py", "wiki_graph.py", "pyproject.toml"]
