[project]
name = "opencode-harbor"
description = "OpenCode v1 taskset/harness agent on Harbor tasks"
license = "MIT"
tags = ["eval", "cli_agent", "v1", "taskset", "harness"]
version = "0.1.3"
requires-python = ">=3.12,<3.14"
dependencies = [
    "verifiers[harbor]>=0.2.1.dev46",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencode_harbor"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "opencode_harbor/tasks"

[tool.hatch.build.targets.sdist]
include = ["opencode_harbor", "tasks", "README.md", "pyproject.toml"]

[tool.ruff]
exclude = ["tasks/**"]
