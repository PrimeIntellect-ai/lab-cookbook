[project]
name = "advanced-patent-q-and-a"
description = "Advanced Agentic RAG over patent documents for Q&A with more comparisons and lookups"
tags = ["patents", "multi-turn", "agentic-search", "rag", "train", "eval", "llm-judge", "v1", "taskset", "harness"]
requires-python = ">=3.11"
version = "0.2.3"
dependencies = [
    "verifiers>=0.1.14",
    "chromadb",
    "datasets",
    "openai",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["advanced_patent_q_and_a.py", "pyproject.toml"]

[project.entry-points."verifiers.environments"]
advanced-patent-q-and-a = "advanced_patent_q_and_a:load_environment"

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 2
