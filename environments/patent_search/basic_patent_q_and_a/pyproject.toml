[project]
name = "basic-patent-q-and-a"
description = "Basic agentic RAG over patent documents for Q&A"
tags = ["patents", "multi-turn", "agentic-search", "rag", "train", "eval", "llm-judge", "v1", "taskset", "harness"]
requires-python = ">=3.11"
version = "0.1.8"
dependencies = [
    "verifiers>=0.1.14",
    "chromadb",
    "datasets",
    "openai",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["basic_patent_q_and_a.py", "pyproject.toml"]

[project.entry-points."verifiers.environments"]
basic-patent-q-and-a = "basic_patent_q_and_a:load_environment"

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 2
