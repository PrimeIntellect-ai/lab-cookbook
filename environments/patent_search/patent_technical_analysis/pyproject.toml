[project]
name = "patent-technical-analysis"
description = "Technical analysis of patent claims, technical innovations, and differentiations"
tags = ["patents", "multi-turn", "agentic-search", "rag", "train", "eval", "llm-judge", "v1", "taskset", "harness"]
requires-python = ">=3.11,<3.14"
version = "0.1.4"
dependencies = [
    "verifiers>=0.1.15.dev403",
    "chromadb",
    "datasets",
    "openai",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["patent_technical_analysis.py", "pyproject.toml"]
