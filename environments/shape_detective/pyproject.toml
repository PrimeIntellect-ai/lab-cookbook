[project]
name = "shape-detective"
version = "0.1.0"
description = "Visual deduction game: identify a hidden tile in a 4x4 grid from shape/color/pattern clues."
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers>=0.2.1.dev46", "pillow>=10.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shape_detective"]
