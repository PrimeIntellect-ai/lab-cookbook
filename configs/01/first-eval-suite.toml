model = "openai/gpt-5.4-nano"
save_results = true

[[eval]]
env_id = "prime/gsm8k"
num_examples = 10
rollouts_per_example = 2
sampling_args = { max_tokens = 1024 }

[[eval]]
env_id = "prime/wordle"
num_examples = 20
rollouts_per_example = 1
sampling_args = { max_tokens = 1024 }

[eval.taskset]
num_eval_examples = 20

[eval.harness]
max_turns = 6
