model = "openai/gpt-oss-20b"
save_results = true

[[eval]]
env_id = "prime/gsm8k"
num_examples = 10
rollouts_per_example = 2
sampling_args = { max_tokens = 1024 }

[[eval]]
env_id = "prime/wordle"
num_examples = 20
rollouts_per_example = 1
sampling_args = { max_tokens = 1024 }
taskset = { num_eval_examples = 20 }
harness = { max_turns = 6 }
