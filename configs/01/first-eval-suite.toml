# v1 eval configs run one taskset per file. Use this companion config after
# configs/01/first-eval.toml to compare a multi-turn game taskset.
model = "openai/gpt-5.4-nano"
num_tasks = 20
num_rollouts = 1
max_turns = 6

[sampling]
max_tokens = 1024

[taskset]
id = "wordle"
num_tasks = 20

[harness]
id = "default"
