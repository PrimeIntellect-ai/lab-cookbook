# GEPA currently uses the legacy v0 environment loader. Use this for v0 prompt optimization.
# Nemotron 3 models. Update both fields when switching sizes.
model = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
reflection_model = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
# model = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
# reflection_model = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"

[[env]]
env_id = "primeintellect/wiki-search"

[gepa]
max_calls = 500
num_train = 100
num_val = 50
minibatch_size = 3
max_concurrent = 32

[sampling]
max_tokens = 2048
