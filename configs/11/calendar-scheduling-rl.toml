model = "openai/gpt-oss-20b"
max_steps = 100
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 2048
reasoning_effort = "medium"

[[orchestrator.train.env]]
name = "calendar-scheduling"
max_turns = 8
taskset = { id = "calendar-scheduling", difficulty = "medium", seed = 7, num_tasks = 512 }
harness = { id = "default" }
