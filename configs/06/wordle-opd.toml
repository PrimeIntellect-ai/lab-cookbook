model = "openai/gpt-oss-20b:my-sft-lora-distilled-from-oss-120b-distill"
loss = "opd"

[teacher]
model = "openai/gpt-oss-120b"

[sampling]
max_tokens = 512
reasoning_effort = "medium"

[[env]]
id = "prime/wordle"

[env.args.taskset]
num_train_examples = 512
num_eval_examples = 128

[env.args.harness]
max_turns = 6
