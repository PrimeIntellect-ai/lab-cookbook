# Held-out SWE benchmark baseline — run before and after training.
model = "openai/gpt-5.4-mini"
num_tasks = 5           # local smoke; drop this line and add --hosted for the real number
num_rollouts = 1
max_turns = 50

[sampling]
max_tokens = 8192

[taskset]
id = "swebench_verified_v1"

[harness]
id = "mini_swe_agent"
runtime = { type = "docker" }
