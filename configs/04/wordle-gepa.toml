model = "openai/gpt-5.5"
reflection_model = "openai/gpt-5.5"
save_to_environment = true

[[env]]
env_id = "wordle"
taskset = { num_train_examples = 100, num_eval_examples = 50 }
harness = { max_turns = 6 }

[gepa]
max_calls = 500
num_train = 100
num_val = 50
minibatch_size = 3
max_concurrent = 32

[sampling]
max_tokens = 1024
